name: Light Scene Cards
description: 軽いシーンカード（カードごとの問い合わせなし・画面外は描かない）。縦型／横型（表紙が左・情報が右）をボタン1つで切り替え、表示する項目も選べる。標準のシーンカードといつでも切り替え可能。
version: "1.9.1"
ui:
  requires:
    - suiteCore
    - serverStore
  javascript:
    - settings.js
    - card.js
    - toolbar.js
    - drag.js
  css:
    - lightCards.css
